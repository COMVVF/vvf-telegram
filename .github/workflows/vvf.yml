name: VVF Telegram

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalità di esecuzione'
        type: choice
        options: [monitor, connect, test]
        default: monitor

permissions:
  contents: write

concurrency:
  group: vvf-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Esegui bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MODE: ${{ inputs.mode || 'monitor' }}
        run: python bot.py --mode "$BOT_MODE"

      - name: Conserva stato invii
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Aggiorna stato notizie VVF'
              git push
            fi
          fi
